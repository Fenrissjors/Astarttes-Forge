name: Apply Astartes Forge v3.0.52

on:
  push:
    branches:
      - feature/unified-adaptive-artwork-v3.0.52
    paths:
      - .github/workflows/apply-v352.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.0.52 migration
        run: |
          python3 tools/v352_core.py
          python3 tools/v352_meta.py

      - name: Verify JavaScript and libraries
        run: |
          node --check src/core/app.js
          node tests/scripts/verify-libraries.js
          node tests/scripts/verify-chapter-visual-registry.js
          node tests/scripts/verify-runtime-hardening.js
          node tests/scripts/verify-dark-angels-prototype.js
          node tests/scripts/verify-artwork-print-renderer.js
          node tests/scripts/verify-a5-adaptive-fit.js
          node tests/scripts/verify-measurable-print-fit.js

      - name: Install artwork validator dependencies
        run: python3 -m pip install --user pillow numpy

      - name: Verify locked artwork
        run: |
          python3 tests/scripts/verify-golden-frame-standard.py
          python3 tests/scripts/validate-frames.py

      - name: Commit verified v3.0.52
        run: |
          rm -f tools/v352_core.py tools/v352_meta.py .github/workflows/apply-v352.yml
          git config user.name "Astartes Forge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v3.0.52: unify adaptive A4 artwork renderer"
          git push origin HEAD:${GITHUB_REF_NAME}
