name: Apply Imperial Fists v3.0.55

on:
  push:
    branches:
      - feature/imperial-fists-frame-v3.0.55
    paths:
      - .github/workflows/apply-imperial-fists-v355.yml

permissions:
  contents: write

jobs:
  build-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validator dependencies
        run: python3 -m pip install --user pillow numpy

      - name: Reconstruct approved artwork source
        run: |
          cat \
            tools/if-frame-webp.b64.part00 \
            tools/if-frame-webp.b64.part01 \
            tools/if-frame-webp.b64.part02 \
            tools/if-frame-webp.b64.part03 \
            tools/if-frame-webp.b64.part04 \
            tools/if-frame-webp.b64.part05 \
            tools/if-frame-webp.b64.part06 \
            tools/if-frame-webp.b64.fix00 \
            tools/if-frame-webp.b64.fix01 \
            tools/if-frame-webp.b64.fix02 \
            tools/if-frame-webp.b64.fix03 \
            tools/if-frame-webp.b64.fix04 \
            tools/if-frame-webp.b64.fix05 \
            tools/if-frame-webp.b64.fix06 \
            tools/if-frame-webp.b64.fix07 \
            tools/if-frame-webp.b64.fix08 \
            tools/if-frame-webp.b64.fix09 \
            tools/if-frame-webp.b64.part08 \
            | base64 -d > /tmp/imperial-fists-source.webp
          echo "1553f862424d10373867442c3b19124f1501e1a07dba21b994df1488169d36ea  /tmp/imperial-fists-source.webp" | sha256sum -c -

      - name: Apply v3.0.55 migration
        run: python3 tools/apply_if_v355.py

      - name: Verify JavaScript and libraries
        run: |
          node --check src/core/app.js
          node --check src/libraries/art/frame-geometry-library.js
          node --check src/libraries/art/a4-frame-engine.js
          node tests/scripts/verify-libraries.js
          node tests/scripts/verify-chapter-visual-registry.js
          node tests/scripts/verify-runtime-hardening.js
          node tests/scripts/verify-dark-angels-prototype.js
          node tests/scripts/verify-artwork-print-renderer.js
          node tests/scripts/verify-a5-adaptive-fit.js
          node tests/scripts/verify-measurable-print-fit.js
          node tests/scripts/verify-artwork-title-geometry.js

      - name: Verify Golden and geometry contracts
        run: |
          python3 tests/scripts/verify-frame-geometry-contract.py
          python3 tests/scripts/verify-golden-frame-standard.py
          python3 tests/scripts/validate-frames.py

      - name: Run roster structural audits
        run: |
          python3 tests/scripts/audit_rosz.py
          python3 tests/scripts/audit-chapter-scope.py
          python3 tests/scripts/audit-structure.py

      - name: Commit verified Imperial Fists frame
        run: |
          rm -f tools/if-frame-webp.b64.part* tools/if-frame-webp.b64.fix* tools/if-frame-src.b64.part* tools/apply_if_v355.py
          rm -f .github/workflows/apply-imperial-fists-v355.yml
          git config user.name "Astartes Forge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v3.0.55: add validated Imperial Fists A4 frame"
          git push origin HEAD:${GITHUB_REF_NAME}
